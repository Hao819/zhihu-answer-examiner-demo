<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">答主考官项目图标</title>
  <desc id="desc">蓝紫渐变背景上的知识卡片、勾选标记和放大镜，代表回答评估与知乎内容校验。</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="950" y2="980" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#056DE8"/>
      <stop offset="0.55" stop-color="#3F7CF3"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="card" x1="248" y1="206" x2="773" y2="774" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF3FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#073B88" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="214" fill="url(#bg)"/>
  <circle cx="115" cy="132" r="112" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="916" cy="873" r="178" fill="#FFFFFF" opacity="0.08"/>

  <g filter="url(#shadow)">
    <rect x="218" y="194" width="568" height="604" rx="76" fill="url(#card)"/>
    <path d="M318 675h170l-57 92-113 31z" fill="#EAF3FF"/>
    <rect x="318" y="304" width="282" height="34" rx="17" fill="#B9D7FA"/>
    <rect x="318" y="380" width="352" height="25" rx="12.5" fill="#D5E6FA"/>
    <rect x="318" y="434" width="291" height="25" rx="12.5" fill="#D5E6FA"/>

    <circle cx="353" cy="558" r="42" fill="#E8F8EF"/>
    <path d="m331 558 15 15 30-35" fill="none" stroke="#16A05D" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="425" y="541" width="190" height="25" rx="12.5" fill="#9FDDBB"/>
  </g>

  <g transform="rotate(-9 690 700)" filter="url(#shadow)">
    <circle cx="682" cy="660" r="116" fill="#FFFFFF" stroke="#D9E9FF" stroke-width="24"/>
    <circle cx="682" cy="660" r="69" fill="none" stroke="#056DE8" stroke-width="25"/>
